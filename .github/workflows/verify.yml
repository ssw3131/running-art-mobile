name: Verify
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      suite:
        type: choice
        options: [all, fast, api, android]
        default: all
      repetitions:
        type: choice
        options: ['1', '10']
        default: '1'
      android_scenario:
        description: 'Targeted diagnostics never replace the required full PR check'
        type: choice
        options: [full, home, generation, service, achievements, accessibility, visual]
        default: full

permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  EXPO_NO_DOTENV: '1'
  CI: '1'

jobs:
  scope:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      full: ${{ steps.scope.outputs.full }}
      tree: ${{ steps.scope.outputs.tree }}
      matrix: ${{ steps.scope.outputs.matrix }}
      android_argument: ${{ steps.scope.outputs.android_argument }}
      reused: ${{ steps.reuse.outputs.reused || 'false' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
      - id: scope
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          ANDROID_SCENARIO: ${{ inputs.android_scenario || 'full' }}
        run: |
          if [ '${{ github.event_name }}' = workflow_dispatch ] || [ -z "$BASE" ] || [ "$BASE" = 0000000000000000000000000000000000000000 ]; then
            node scripts/qa/scope.mjs --all
          else
            node scripts/qa/scope.mjs "$BASE"
            node scripts/qa/docs.mjs "$BASE"
          fi
      - id: reuse
        name: Verify identical-tree PR evidence before reusing main results
        if: github.event_name == 'push' && steps.scope.outputs.full == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/qa/reuse-ci.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && github.event_name == 'push' && steps.scope.outputs.full == 'true'
        with:
          name: verification-reuse-${{ github.run_attempt }}
          path: test-results/ci/reuse.json
          retention-days: 7

  fast:
    needs: scope
    if: needs.scope.outputs.full == 'true' && needs.scope.outputs.reused != 'true' && (github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'fast')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
          cache: npm
      - name: Validate Android harness before native build feedback
        run: python -m unittest discover -s scripts/qa -p 'test_*.py'
      - run: bash scripts/cloud.sh setup
      - run: bash scripts/cloud.sh fast
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: fast-${{ github.run_attempt }}
          path: test-results/fast
          retention-days: 7

  api:
    needs: scope
    if: needs.scope.outputs.full == 'true' && needs.scope.outputs.reused != 'true' && !github.event.pull_request.draft && (github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'api')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
          cache: npm
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/qa/requirements.txt
      - name: Install verified Supabase CLI
        env:
          RUNPEN_RELEASE_DOWNLOAD_TOKEN: ${{ github.token }}
        run: |
          python scripts/qa/install-supabase.py
          echo "$GITHUB_WORKSPACE/.tools/supabase-2.120.0" >> "$GITHUB_PATH"
      - run: npm ci
      - run: pip install -r scripts/qa/requirements.txt
      - run: python scripts/qa/fuzz.py
      - name: Isolated PostgreSQL, Auth and Storage
        run: |
          mkdir -p .cache test-results/integration
          supabase start -x studio,imgproxy,realtime,edge-runtime,logflare,vector,supavisor > test-results/integration/stack.log 2>&1
          supabase status -o json > .cache/qa-supabase-status.json
          supabase test db supabase/tests/database > test-results/integration/pgtap.log 2>&1
          python scripts/qa/postgres.py > test-results/integration/postgres.log 2>&1
          npm run qa:integration
      - name: Stop isolated containers
        if: always()
        run: |
          supabase stop --no-backup
          rm -f .cache/qa-supabase-status.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: api-${{ github.run_attempt }}
          path: |
            test-results/fuzz
            test-results/integration/report.*
            test-results/integration/supabase-roundtrip.log
            test-results/integration/pgtap.log
            test-results/integration/postgres.log
          retention-days: 7

  android:
    needs: scope
    if: needs.scope.outputs.full == 'true' && needs.scope.outputs.reused != 'true' && !github.event.pull_request.draft && (github.event_name != 'workflow_dispatch' || inputs.suite == 'all' || inputs.suite == 'android')
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.repetitions == '10' && 240 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        api: ${{ fromJSON(needs.scope.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: npm ci
      - run: python scripts/qa/install-maestro.py
        env:
          RUNPEN_RELEASE_DOWNLOAD_TOKEN: ${{ github.token }}
      - name: Install verified Supabase CLI
        env:
          RUNPEN_RELEASE_DOWNLOAD_TOKEN: ${{ github.token }}
        run: |
          python scripts/qa/install-supabase.py
          echo "$GITHUB_WORKSPACE/.tools/supabase-2.120.0" >> "$GITHUB_PATH"
      - name: Start exclusive Android Auth and membership backend
        run: |
          mkdir -p .cache
          supabase start -x studio,imgproxy,realtime,edge-runtime,logflare,vector,supavisor > .cache/android-supabase.log 2>&1
          supabase status -o json > .cache/qa-supabase-status.json
          # Validate real disposable identities and receipt setup before the
          # expensive native build; these are setup checks, not Android passes.
          node scripts/qa/prepare-membership-fixture.mjs prepare
          node scripts/qa/prepare-membership-fixture.mjs new-signup
          node scripts/qa/prepare-membership-fixture.mjs session signup
          node scripts/qa/prepare-membership-fixture.mjs session service
          node scripts/qa/prepare-membership-fixture.mjs assert-complete service
          node scripts/qa/prepare-membership-fixture.mjs cleanup
          rm -f .cache/emulator-auth/session.json
      - name: Build test APK with no local credentials or test hooks
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://localhost:54431
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_isolated_ci
          EXPO_PUBLIC_PROFILE_PHOTOS_ENABLED: 'false'
          EXPO_PUBLIC_COMPUTE_BASE_URL: https://localhost/api
        run: |
          python -m unittest discover -s scripts/qa -p 'test_*.py'
          npm run prebuild:android
          python scripts/qa/android-membership-tls.py prepare
          # Keep the existing instrumentation helpers and target signed by the same QA certificate.
          export RUNPEN_KEYSTORE="$RUNNER_TEMP/runpen-qa.p12"
          export RUNPEN_STORE_PASSWORD=isolated-qa-only RUNPEN_KEY_PASSWORD=isolated-qa-only
          export RUNPEN_KEY_ALIAS=runpen-qa RUNPEN_VERSION_CODE=2
          "$JAVA_HOME/bin/keytool" -importkeystore -noprompt -srckeystore android/app/debug.keystore -srcstorepass android -srckeypass android -srcalias androiddebugkey -destkeystore "$RUNPEN_KEYSTORE" -deststoretype PKCS12 -deststorepass:env RUNPEN_STORE_PASSWORD -destkeypass:env RUNPEN_KEY_PASSWORD -destalias "$RUNPEN_KEY_ALIAS"
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease -I ../scripts/ci/handset-signing.gradle -PreactNativeArchitectures=x86_64 --no-daemon --max-workers=2
          cd ..
          python scripts/qa/check-apk.py android/app/build/outputs/apk/release/app-release.apk
          "$JAVA_HOME/bin/keytool" -exportcert -keystore "$RUNPEN_KEYSTORE" -storepass:env RUNPEN_STORE_PASSWORD -alias "$RUNPEN_KEY_ALIAS" -file "$RUNNER_TEMP/runpen-qa.der"
          expected="$(sha256sum "$RUNNER_TEMP/runpen-qa.der" | cut -d ' ' -f 1)"
          actual="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs android/app/build/outputs/apk/release/app-release.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')"
          test "$actual" = "$expected"
          echo 'Shared signing configuration and APK certificate verified with the shared QA fixture certificate.'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_5
          avd-name: RunPen_CI
          # API 29 otherwise inherits a 16 MB heap from the newer Pixel profile.
          heap-size: 256M
          emulator-options: -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -prop persist.sys.locale=en-US
          disable-animations: true
          script: python scripts/qa/run-membership-android.py --serial emulator-5554 --apk android/app/build/outputs/apk/release/app-release.apk --repeat ${{ inputs.repetitions || '1' }} ${{ matrix.api == 29 && '--smoke' || needs.scope.outputs.android_argument }} --output test-results/android-${{ matrix.api }}
      - name: Compare reviewed API 36 screens
        if: matrix.api == 36 && (github.event_name != 'workflow_dispatch' || inputs.android_scenario == 'full' || inputs.android_scenario == 'visual')
        run: node scripts/qa/visual-suite.mjs test-results/android-36 tests/visual/android-linux-api36/baseline.json
      - name: Build screenshot report
        if: always()
        run: node scripts/qa/gallery.mjs test-results/android-${{ matrix.api }}
      - name: Clean isolated membership backend and native QA trust
        if: always()
        run: |
          cleanup_status=0
          python scripts/qa/android-membership-tls.py restore || cleanup_status=1
          if [ -f .cache/qa-membership/private-state.json ]; then
            node scripts/qa/prepare-membership-fixture.mjs cleanup || cleanup_status=1
          fi
          supabase stop --no-backup || cleanup_status=1
          rm -f .cache/qa-supabase-status.json .cache/qa-membership/tls/ca.key .cache/qa-membership/tls/server.key
          rm -f "$RUNNER_TEMP/runpen-qa.p12" "$RUNNER_TEMP/runpen-qa.der"
          exit "$cleanup_status"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: android-${{ matrix.api }}-${{ github.run_attempt }}
          path: test-results/android-${{ matrix.api }}
          retention-days: 7

  gate:
    # A partial manual run must never satisfy the required PR check.
    name: ${{ github.event_name == 'workflow_dispatch' && 'manual-verification' || github.event.pull_request.draft && 'development-feedback' || 'verification-gate' }}
    needs: [scope, fast, api, android]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
      - env:
          SCOPE: ${{ needs.scope.result }}
          FULL: ${{ needs.scope.outputs.full }}
          DRAFT: ${{ github.event.pull_request.draft && 'true' || 'false' }}
          REUSED: ${{ needs.scope.outputs.reused }}
          VERIFIED_TREE: ${{ needs.scope.outputs.tree }}
          FAST: ${{ needs.fast.result }}
          API: ${{ needs.api.result }}
          ANDROID: ${{ needs.android.result }}
          SUITE: ${{ github.event_name == 'workflow_dispatch' && inputs.suite || 'all' }}
        run: node scripts/qa/gate.mjs
      - name: Publish exact-tree full verification receipt
        if: github.event_name == 'pull_request' && !github.event.pull_request.draft && needs.scope.outputs.full == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-${{ needs.scope.outputs.tree }}-${{ github.run_attempt }}
          path: test-results/ci/verified.json
          if-no-files-found: error
          retention-days: 7
