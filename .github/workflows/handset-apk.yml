name: Handset APK
on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'main, codex/* branch, or full SHA reachable from those branches'
        required: true
        default: main
        type: string
      kind:
        description: 'development needs Metro; preview runs independently'
        required: true
        default: preview
        type: choice
        options: [development, preview]
permissions:
  contents: read
concurrency:
  group: handset-apk
  cancel-in-progress: false
env:
  CI: '1'
  EXPO_NO_DOTENV: '1'
jobs:
  source:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: resolve
        env:
          SOURCE_REF: ${{ inputs.source_ref }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$SOURCE_REF" == main || "$SOURCE_REF" == codex/* ]]; then
            git check-ref-format "refs/heads/$SOURCE_REF"
            sha="$(git rev-parse --verify "refs/remotes/origin/$SOURCE_REF^{commit}")"
          elif [[ "$SOURCE_REF" =~ ^[a-fA-F0-9]{40}$ ]]; then
            sha="$(git rev-parse --verify "$SOURCE_REF^{commit}")"
          else
            echo "Select a trusted main/codex branch or full reachable SHA"; exit 1
          fi
          trusted=false
          while IFS= read -r ref; do
            if git merge-base --is-ancestor "$sha" "$ref"; then trusted=true; break; fi
          done < <(git for-each-ref --format='%(refname)' refs/remotes/origin/main 'refs/remotes/origin/codex/*')
          [[ "$trusted" == true ]] || { echo "Commit not reachable from a trusted repository branch"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
  build:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: handset-build
    env:
      APK_KIND: ${{ inputs.kind }}
      EXPO_PUBLIC_MAPTILER_API_KEY: ${{ secrets.EXPO_PUBLIC_MAPTILER_API_KEY }}
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_COMPUTE_BASE_URL: ${{ secrets.EXPO_PUBLIC_COMPUTE_BASE_URL }}
      EXPO_PUBLIC_ROAD_BASE_URL: ${{ secrets.EXPO_PUBLIC_ROAD_BASE_URL }}
      EXPO_PUBLIC_RUN_SHARE_URL: ${{ secrets.EXPO_PUBLIC_RUN_SHARE_URL }}
      EXPO_PUBLIC_ACCOUNT_DELETION_ENABLED: ${{ vars.EXPO_PUBLIC_ACCOUNT_DELETION_ENABLED }}
      EXPO_PUBLIC_AUTH_KAKAO_ENABLED: ${{ vars.EXPO_PUBLIC_AUTH_KAKAO_ENABLED }}
      EXPO_PUBLIC_AUTH_NAVER_ENABLED: ${{ vars.EXPO_PUBLIC_AUTH_NAVER_ENABLED }}
      EXPO_PUBLIC_PROFILE_PHOTOS_ENABLED: ${{ vars.EXPO_PUBLIC_PROFILE_PHOTOS_ENABLED }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.source.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.21.0'
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - run: node scripts/ci/handset-config.mjs
      - run: npm ci
      - run: npm run check
      - name: Generate native project
        run: npm run prebuild:android
      - name: Build signed handset APK
        env:
          RUNPEN_KEYSTORE_BASE64: ${{ secrets.RUNPEN_KEYSTORE_BASE64 }}
          RUNPEN_STORE_PASSWORD: ${{ secrets.RUNPEN_STORE_PASSWORD }}
          RUNPEN_KEY_PASSWORD: ${{ secrets.RUNPEN_KEY_PASSWORD }}
          RUNPEN_KEY_ALIAS: ${{ secrets.RUNPEN_KEY_ALIAS }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          export RUNPEN_KEYSTORE="$RUNNER_TEMP/runpen-test.p12"
          trap 'rm -f "$RUNPEN_KEYSTORE"' EXIT
          printf '%s' "$RUNPEN_KEYSTORE_BASE64" | base64 --decode > "$RUNPEN_KEYSTORE"
          unset RUNPEN_KEYSTORE_BASE64
          export RUNPEN_VERSION_CODE="$(($(date +%s) - 1577836800))"
          echo "RUNPEN_VERSION_CODE=$RUNPEN_VERSION_CODE" >> "$GITHUB_ENV"
          task=assembleRelease
          if [[ "$APK_KIND" == development ]]; then task=assembleDebug; fi
          cd android
          chmod +x gradlew
          ./gradlew "$task" -I ../scripts/ci/handset-signing.gradle -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon --max-workers=2
      - name: Verify signature and package installation files
        env:
          RUNPEN_CERT_SHA256: ${{ vars.RUNPEN_CERT_SHA256 }}
        run: node scripts/ci/package-handset.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runpen-${{ inputs.kind }}-${{ needs.source.outputs.sha }}-${{ github.run_attempt }}
          path: build/handset/
          if-no-files-found: error
          retention-days: 7
      - name: Remove any remaining private key
        if: always()
        run: rm -f "$RUNNER_TEMP/runpen-test.p12"
